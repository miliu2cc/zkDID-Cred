[workspace]
members = ["core", "holder", "issuer", "verifier", "blockchain", "holder-lib"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
ed25519-dalek = "3.0.0"
serde_json = "1.0.150"
serde = { version = "1.0.229", features = ["derive"]}
base58 = "0.2.0"
bs58 = "0.5.1"
thiserror = "2.0.18"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"
sha3 = "0.10"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
chacha20poly1305 = "0.11.0"
